name: Build and release APK

# Every push to main builds the app. When versionName in app/build.gradle.kts is new,
# the APK is published as release v<versionName>; otherwise it is only kept as a build artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Every version must be signed with the same key, or Android refuses to update the installed app.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing the SIGNING_KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GestorCapturas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GestorCapturas
          path: GestorCapturas.apk

      - name: Check whether this version is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gestor de capturas ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: GestorCapturas.apk
          generate_release_notes: true

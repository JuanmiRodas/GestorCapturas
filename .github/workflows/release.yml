name: Build and release APK

# Every push to main builds the app. When versionName in app/build.gradle.kts is new,
# the APK is published as release v<versionName>; otherwise it is only kept as a build artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Certificate of the key every installed copy is signed with.
  EXPECTED_CERT_SHA256: f09ac3a961a84a6f73937bcda29101d8cce72c22e115fa55d174640e2f29f205

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME).

      # Every version must be signed with the same key, or Android refuses to update the installed app.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing the SIGNING_KEYSTORE_BASE64 secret"
            exit 1
          fi
          keystore="$RUNNER_TEMP/signing.keystore"
          echo "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          fingerprint=$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey | grep -oP 'SHA256: \K.*' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$fingerprint" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::The signing key in SIGNING_KEYSTORE_BASE64 is not the app's key (got '$fingerprint')"
            exit 1
          fi
          echo "SIGNING_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the APK signature
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GestorCapturas.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs GestorCapturas.apk | grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" \
            || { echo "::error::GestorCapturas.apk is not signed with the app's key"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: GestorCapturas
          path: GestorCapturas.apk

      - name: Check whether this version is new
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Gestor de capturas ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: GestorCapturas.apk
          generate_release_notes: true

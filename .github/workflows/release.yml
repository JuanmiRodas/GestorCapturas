name: Build and release APK

# Push a tag such as v2.3 to publish that version as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Every version must be signed with the same key, or Android refuses to update the installed app.
      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GestorCapturas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GestorCapturas
          path: GestorCapturas.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GestorCapturas.apk
          generate_release_notes: true
